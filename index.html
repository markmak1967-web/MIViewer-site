<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISB Viewer</title>
<style>
:root{
  --bg:#0e1012;--p1:#15181b;--p2:#1b1f23;--p3:#23282d;--line:#2c3238;--line2:#3a424a;
  --tx:#cdd3d9;--mu:#7f8a94;--dim:#56606a;--acc:#f0a030;--acc2:rgba(240,160,48,.16);
  --ok:#7fbf7f;--bad:#e06c5c;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 var(--mono);overflow:hidden}
button,select,input{font:inherit;color:var(--tx);background:var(--p3);border:1px solid var(--line2);border-radius:2px;padding:3px 7px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.4;cursor:default;border-color:var(--line2)}
input[type=number]{width:72px}
input[type=text]{width:100%}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);vertical-align:-2px}
select{max-width:100%}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
#secbar{display:none;text-align:center;font-weight:bold;letter-spacing:.12em;padding:2px;background:#2d6a2d;color:#fff}
#secbar.show{display:block}
header{display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--p1);border-bottom:1px solid var(--line)}
header .logo{font-weight:bold;letter-spacing:.14em;color:var(--acc)}
header .ver{color:var(--dim)}
header #fileName{color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
header #status{margin-left:auto;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}
#left{display:grid;grid-template-rows:1fr 5px var(--bottomH,300px) 96px;min-width:0;min-height:0}
#mapWrap{position:relative;min-height:0;overflow:hidden;background:#0b0d0e}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#map.draw{cursor:crosshair}
#map.drag{cursor:grabbing}
#mapTools{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
#mapTools button{background:rgba(21,24,27,.9)}
#mapRead{position:absolute;bottom:4px;left:8px;color:var(--tx);background:rgba(14,16,18,.75);padding:2px 6px;pointer-events:none}
#mapAttr{position:absolute;bottom:4px;right:8px;color:var(--mu);background:rgba(14,16,18,.75);padding:2px 6px;font-size:10px;pointer-events:none}
#legend{position:absolute;top:8px;right:8px;background:rgba(14,16,18,.82);padding:5px 8px;border:1px solid var(--line);pointer-events:none;line-height:1.6}
#legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mu);pointer-events:none;text-align:center}
#drop b{color:var(--tx);font-size:14px;letter-spacing:.08em}
body.dragover #mapWrap{outline:2px dashed var(--acc);outline-offset:-6px}
#split{background:var(--line);cursor:row-resize}
#split:hover{background:var(--acc)}
#bottom{display:grid;grid-template-columns:auto 1fr;min-height:0;background:var(--p1)}
#vidWrap{position:relative;height:100%;aspect-ratio:var(--vidAR,16/9);background:#000;overflow:hidden}
#vid{width:100%;height:100%;display:block;object-fit:fill}
#vidOv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#vidMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:20px;pointer-events:none}
#ctrl{display:flex;flex-direction:column;gap:6px;padding:8px 10px;min-width:0;overflow:auto}
.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tc{font-size:18px;color:var(--acc);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:1px 10px}
.kv span:nth-child(odd){color:var(--mu)}
#tl{width:100%;height:96px;display:block;background:var(--p1);border-top:1px solid var(--line);cursor:pointer}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--p1);min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:none;padding:7px 0;color:var(--mu);border-bottom:2px solid transparent}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none;overflow:auto;padding:10px;flex:1;min-height:0}
.pane.on{display:block}
h3{margin:12px 0 6px;font-size:11px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px}
h3:first-child{margin-top:0}
table{border-collapse:collapse;width:100%}
td,th{padding:2px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mu);font-weight:normal}
td.n{text-align:right;white-space:nowrap}
td.k{color:var(--mu);white-space:nowrap}
td.t{color:var(--dim);text-align:right;width:28px}
.muted{color:var(--mu)}
.dim{color:var(--dim)}
.okc{color:var(--ok)}
.badc{color:var(--bad)}
.accc{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;align-items:center}
.grid2 label{color:var(--mu)}
.field{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.field label{color:var(--mu)}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.note{color:var(--mu);font-size:11px;margin:4px 0 8px}
.res{border:1px solid var(--line);padding:5px 6px;margin-bottom:4px;cursor:pointer;background:var(--p2)}
.res:hover,.res.sel{border-color:var(--acc)}
.res .h{display:flex;justify-content:space-between;color:var(--acc)}
.rule{display:grid;grid-template-columns:1fr 54px 70px 22px;gap:3px;margin-bottom:3px}
.rule button{padding:0}
pre.hex{white-space:pre-wrap;word-break:break-all;color:var(--mu);font-size:11px;background:var(--p2);padding:6px;margin:4px 0}
.bar{height:4px;background:var(--p3);margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc)}
kbd{border:1px solid var(--line2);padding:0 3px;border-radius:2px;color:var(--mu)}
</style>
</head>
<body>
<div id="app">
<div id="secbar"></div>
<header>
  <span class="logo">MISB VIEWER</span><span class="ver" id="ver"></span>
  <button id="btnOpen" title="Open video, KLV, CSV/JSON metadata or DEM">Open…</button>
  <input type="file" id="fileIn" multiple hidden>
  <span id="fileName" class="muted">no file</span>
  <span id="status"></span>
</header>
<main>
<section id="left">
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="mapTools">
      <button id="bFit" title="Fit map to flight">Fit</button>
      <button id="bFollow" title="Keep current footprint in view">Follow</button>
      <button id="bOrtho" title="Drape current frame on the map (pseudo-ortho)">Ortho</button>
      <button id="bHist" title="Show footprint history">History</button>
      <button id="bAoi" title="Draw observation area: click vertices, double-click to finish. One click + Enter = point">Draw AOI</button>
      <button id="bAoiClr" title="Clear AOI">Clear AOI</button>
    </div>
    <div id="legend"></div>
    <div id="drop"><b>DROP MOTION IMAGERY HERE</b><span>MISB MPEG-TS (.ts .m2ts .mpg) · MP4/MOV · raw KLV (.klv .bin)<br>sidecar metadata (.csv .json) · ESRI ASCII DEM (.asc)</span></div>
    <div id="mapRead"></div>
    <div id="mapAttr"></div>
  </div>
  <div id="split" title="Drag to resize"></div>
  <div id="bottom">
    <div id="vidWrap"><video id="vid" muted playsinline preload="auto"></video><canvas id="vidOv"></canvas><div id="vidMsg">No video loaded</div></div>
    <div id="ctrl">
      <div class="row"><span class="tc" id="tc">--:--.---</span><span class="muted" id="fr">frame – / –</span></div>
      <div class="row">
        <button id="bStart" title="Start (Home)">|◀</button>
        <button id="bBack" title="−1 s (Shift+←)">◀◀</button>
        <button id="bPrev" title="−1 frame (←)">◀|</button>
        <button id="bPlay" title="Play/Pause (Space)" style="min-width:44px">▶</button>
        <button id="bNext" title="+1 frame (→)">|▶</button>
        <button id="bFwd" title="+1 s (Shift+→)">▶▶</button>
        <button id="bEnd" title="End (End)">▶|</button>
        <select id="rate" title="Playback rate"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
      </div>
      <div class="row">
        <button id="bIn" title="Set clip in (I)">In</button>
        <button id="bOut" title="Set clip out (O)">Out</button>
        <button id="bClr" title="Clear clip">Clear</button>
        <label><input type="checkbox" id="cLoop"> loop clip</label>
        <span class="muted" id="clipTxt"></span>
      </div>
      <div class="kv" id="hud"></div>
    </div>
  </div>
  <canvas id="tl"></canvas>
</section>
<aside>
  <div id="tabs">
    <button data-p="pFile" class="on">FILE</button>
    <button data-p="pMeta">META</button>
    <button data-p="pSearch">SEARCH</button>
    <button data-p="pExport">EXPORT</button>
    <button data-p="pSet">SETTINGS</button>
  </div>
  <div class="pane on" id="pFile"><p class="muted">Open or drop a file to begin.</p></div>
  <div class="pane" id="pMeta"></div>
  <div class="pane" id="pSearch"></div>
  <div class="pane" id="pExport"></div>
  <div class="pane" id="pSet"></div>
</aside>
</main>
</div>
<script>
'use strict';
/* =====================================================================
   MISB VIEWER — single-file motion imagery metadata viewer
   No external libraries. No embedded binary. Network use is optional:
   basemap tiles and Terrarium DEM tiles only, both switchable off.
   ===================================================================== */
const BUILD = { ver: 'R0.1.0', build: 1 };

/* ---------- small utilities ---------- */
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, f) => a + (b - a) * f;
const isNum = v => typeof v === 'number' && isFinite(v);
const wrap360 = a => ((a % 360) + 360) % 360;
const angLerp = (a, b, f) => { let d = ((b - a + 540) % 360) - 180; return wrap360(a + d * f); };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmtT(t) {
  if (!isNum(t)) return '--:--.---';
  const s = Math.max(0, t), m = Math.floor(s / 60), r = s - m * 60;
  const hh = Math.floor(m / 60);
  return (hh ? hh + ':' + String(m % 60).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + r.toFixed(3).padStart(6, '0');
}
function fmtUTC(us) {
  if (!isNum(us)) return '–';
  const d = new Date(us / 1000);
  if (isNaN(d)) return '–';
  return d.toISOString().replace('T', ' ').replace('Z', 'Z');
}
const fx = (v, n = 1) => isNum(v) ? v.toFixed(n) : '–';
const fdeg = (v, n = 6) => isNum(v) ? v.toFixed(n) : '–';
function hex(u8, max = 4096) {
  let s = '';
  const n = Math.min(u8.length, max);
  for (let i = 0; i < n; i++) s += u8[i].toString(16).padStart(2, '0') + (i % 16 === 15 ? '\n' : ' ');
  return s + (u8.length > max ? '… (' + u8.length + ' bytes)' : '');
}
function download(name, data, type = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob(Array.isArray(data) ? data : [data], { type });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function concatU8(parts, total) {
  if (total === undefined) total = parts.reduce((s, p) => s + p.length, 0);
  const out = new Uint8Array(total); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function readU(b, i = 0, n = b.length - i) { let v = 0; for (let k = 0; k < n; k++) v = v * 256 + b[i + k]; return v; }
function readS(b, i = 0, n = b.length - i) { const u = readU(b, i, n); return b[i] & 0x80 ? u - 2 ** (8 * n) : u; }
const td = new TextDecoder('utf-8');
const str = b => td.decode(b).replace(/\0+$/, '');
function median(a) { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; }
function bsearchLE(arr, t, key) { // largest index with key(arr[i]) <= t
  let lo = 0, hi = arr.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (key(arr[m]) <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

/* =====================================================================
   MPEG-TS DEMUX (ISO/IEC 13818-1) — PAT/PMT, PES, KLV per MISB ST1402
   ===================================================================== */
const STREAM_TYPES = {
  0x01: ['video', 'MPEG-1 video'], 0x02: ['video', 'MPEG-2 video'], 0x10: ['video', 'MPEG-4 Part 2'],
  0x1B: ['video', 'H.264/AVC'], 0x24: ['video', 'H.265/HEVC'],
  0x03: ['audio', 'MPEG-1 audio'], 0x04: ['audio', 'MPEG-2 audio'], 0x0F: ['audio', 'AAC'], 0x11: ['audio', 'AAC LATM'], 0x81: ['audio', 'AC-3'],
  0x15: ['klv', 'Metadata in PES (sync KLV)'], 0x06: ['private', 'Private PES'],
};

function detectTS(u8) {
  for (const ps of [188, 192, 204]) {
    const pre = ps === 192 ? 4 : 0;
    for (let off = 0; off < ps; off++) {
      let ok = true;
      for (let k = 0; k < 6; k++) { const p = off + k * ps + pre; if (p >= u8.length || u8[p] !== 0x47) { ok = false; break; } }
      if (ok) return { ps, off: off + pre };
    }
  }
  return null;
}

function readPTS(b, i) {
  return ((b[i] >> 1) & 7) * 1073741824 + b[i + 1] * 4194304 + (b[i + 2] >> 1) * 32768 + b[i + 3] * 128 + (b[i + 4] >> 1);
}

function makeUnwrapper() {
  let last = null, add = 0;
  return v => {
    if (v === null || v === undefined) return v;
    let x = v + add;
    if (last !== null) {
      if (x - last < -4294967296) { add += 8589934592; x += 8589934592; }
      else if (x - last > 4294967296) { add -= 8589934592; x -= 8589934592; }
    }
    last = x; return x;
  };
}

function parsePSI(pay) {
  const ptr = pay[0];
  const s = 1 + ptr;
  if (s + 3 > pay.length) return null;
  const tid = pay[s], len = ((pay[s + 1] & 0x0F) << 8) | pay[s + 2];
  return { tid, sec: pay.subarray(s, Math.min(pay.length, s + 3 + len)), len };
}

async function demuxTS(u8, progress) {
  const det = detectTS(u8);
  if (!det) throw new Error('No MPEG-TS sync found');
  const { ps } = det;
  const pmtPids = new Map(); // pid -> program
  const streams = new Map(); // pid -> info
  const cur = new Map();     // pid -> {off, chunks, len}
  const pesList = new Map(); // pid -> [{off, data, pts, dts, sid}]
  const unwrap = new Map();
  let firstPAT = null, firstPMT = null, pcrPid = -1, pktCount = 0, resyncs = 0;

  function flush(pid) {
    const c = cur.get(pid); if (!c) return;
    cur.delete(pid);
    const d = c.chunks.length === 1 ? c.chunks[0] : concatU8(c.chunks, c.len);
    if (d.length < 9 || d[0] !== 0 || d[1] !== 0 || d[2] !== 1) return;
    const sid = d[3], plen = (d[4] << 8) | d[5];
    let pts = null, dts = null, start = 6;
    if (!(sid === 0xBC || sid === 0xBE || sid === 0xBF || sid === 0xF0 || sid === 0xF1 || sid === 0xFF || sid === 0xF2 || sid === 0xF8)) {
      const flags = d[7], hdl = d[8];
      if ((flags & 0x80) && d.length >= 14) pts = readPTS(d, 9);
      if ((flags & 0x40) && d.length >= 19) dts = readPTS(d, 14);
      start = 9 + hdl;
    }
    let end = plen ? Math.min(d.length, 6 + plen) : d.length;
    if (start > end) return;
    let uw = unwrap.get(pid); if (!uw) { uw = makeUnwrapper(); unwrap.set(pid, uw); }
    if (pts !== null) pts = uw(pts);
    if (dts !== null) dts = uw(dts);
    let arr = pesList.get(pid); if (!arr) { arr = []; pesList.set(pid, arr); }
    arr.push({ off: c.off, data: d.subarray(start, end), pts, dts, sid });
  }

  const n = u8.length;
  let lastYield = performance.now();
  for (let p = det.off; p + 188 <= n; p += ps) {
    if (u8[p] !== 0x47) { // resync
      let q = p + 1;
      while (q + 188 <= n && !(u8[q] === 0x47 && (q + ps >= n || u8[q + ps] === 0x47))) q++;
      resyncs++; p = q - ps; continue;
    }
    pktCount++;
    const b1 = u8[p + 1], pusi = b1 & 0x40, pid = ((b1 & 0x1F) << 8) | u8[p + 2], afc = (u8[p + 3] >> 4) & 3;
    let i = p + 4;
    if (afc & 2) i += 1 + u8[p + 4];
    if (!(afc & 1) || i >= p + 188) continue;
    const pay = u8.subarray(i, p + 188);
    if (pid === 0) {
      if (!pusi) continue;
      const psi = parsePSI(pay); if (!psi || psi.tid !== 0) continue;
      if (!firstPAT) firstPAT = u8.slice(p, p + 188);
      const sec = psi.sec, end = Math.min(sec.length, 3 + psi.len - 4);
      for (let k = 8; k + 4 <= end; k += 4) {
        const prog = (sec[k] << 8) | sec[k + 1], ppid = ((sec[k + 2] & 0x1F) << 8) | sec[k + 3];
        if (prog !== 0) pmtPids.set(ppid, prog);
      }
    } else if (pmtPids.has(pid)) {
      if (!pusi) continue;
      const psi = parsePSI(pay); if (!psi || psi.tid !== 2) continue;
      if (!firstPMT) firstPMT = u8.slice(p, p + 188);
      const sec = psi.sec;
      pcrPid = ((sec[8] & 0x1F) << 8) | sec[9];
      const pil = ((sec[10] & 0x0F) << 8) | sec[11];
      const end = Math.min(sec.length, 3 + psi.len - 4);
      for (let k = 12 + pil; k + 5 <= end;) {
        const st = sec[k], epid = ((sec[k + 1] & 0x1F) << 8) | sec[k + 2], eil = ((sec[k + 3] & 0x0F) << 8) | sec[k + 4];
        if (!streams.has(epid)) {
          const descs = []; let reg = '';
          for (let j = k + 5; j + 2 <= k + 5 + eil && j + 2 <= end;) {
            const tag = sec[j], dl = sec[j + 1];
            descs.push(tag);
            if (tag === 0x05 && dl >= 4) reg = String.fromCharCode(sec[j + 2], sec[j + 3], sec[j + 4], sec[j + 5]);
            if (tag === 0x26 && dl >= 9) reg = reg || 'META';
            j += 2 + dl;
          }
          let [kind, codec] = STREAM_TYPES[st] || ['other', 'stream_type 0x' + st.toString(16)];
          if (reg === 'KLVA' || (st === 0x15)) { kind = 'klv'; codec = st === 0x15 ? 'KLV synchronous (0x15)' : 'KLV asynchronous (0x06/KLVA)'; }
          if (st === 0x06 && reg === 'AC-3') { kind = 'audio'; codec = 'AC-3'; }
          streams.set(epid, { pid: epid, st, kind, codec, reg, descs, prog: pmtPids.get(pid) });
        }
        k += 5 + eil;
      }
    } else {
      const s = streams.get(pid);
      if (!s) continue;
      if (s.kind !== 'video' && s.kind !== 'klv' && s.kind !== 'private') continue;
      if (pusi) { flush(pid); cur.set(pid, { off: p, chunks: [pay], len: pay.length }); }
      else { const c = cur.get(pid); if (c) { c.chunks.push(pay); c.len += pay.length; } }
    }
    if ((pktCount & 0x7FFF) === 0 && performance.now() - lastYield > 60) {
      progress && progress(p / n); await new Promise(r => setTimeout(r)); lastYield = performance.now();
    }
  }
  for (const pid of [...cur.keys()]) flush(pid);
  return { det, streams, pesList, firstPAT, firstPMT, pcrPid, pktCount, resyncs };
}

/* ---------- H.264 helpers ---------- */
function splitAnnexB(d) {
  const nals = []; let i = 0, start = -1; const n = d.length;
  while (i + 2 < n) {
    if (d[i + 2] > 1) { i += 3; continue; }
    if (d[i] === 0 && d[i + 1] === 0 && d[i + 2] === 1) {
      if (start >= 0) { let e = i; while (e > start && d[e - 1] === 0) e--; if (e > start) nals.push(d.subarray(start, e)); }
      i += 3; start = i;
    } else i++;
  }
  if (start >= 0 && start < n) nals.push(d.subarray(start, n));
  return nals;

const S = {

async function openFiles(files) {
  const list = [...files];
  const isVid = f => /\.(ts|m2ts|mts|mpg|mpeg|trp|tsv|mp4|m4v|mov|3gp)$/i.test(f.name);
  const vids = list.filter(isVid), others = list.filter(f => !isVid(f));
  // order: DEM first, then video, then sidecars
  for (const f of others.filter(f => /\.asc$/i.test(f.name))) await loadASC(f);
  if (vids.length) await loadVideoFile(vids[0]);
  for (const f of others.filter(f => !/\.asc$/i.test(f.name))) await loadSidecar(f);
  if (!vids.length && !others.length) status('Unsupported file');
}

async function loadVideoFile(file) {
  resetState();
  S.name = file.name; S.size = file.size;
  $('#fileName').textContent = file.name; $('#drop').style.display = 'none';
  status('Reading ' + (file.size / 1048576).toFixed(1) + ' MB…');
  const t0 = performance.now();
  try {
    const buf = new Uint8Array(await file.arrayBuffer());

    const isMP4 = buf.length > 12 && /^(ftyp|moov|free|mdat|wide|skip)$/.test(String.fromCharCode(buf[4], buf[5], buf[6], buf[7]));

  if (!S.klv.length && S.sidecar) { S.klv = S.sidecar; warn('Using previously loaded sidecar metadata'); }

}

async function loadTS(buf) {
  S.kind = 'ts';
  const ts = await demuxTS(buf, f => status('Demuxing… ' + Math.round(f * 100) + '%'));
  S.ts = ts;
  if (ts.resyncs) warn(ts.resyncs + ' sync losses during demux');
  const vs = [...ts.streams.values()].find(s => s.kind === 'video');
  if (vs) {
    const v = buildVideoFromTS(vs, ts.pesList.get(vs.pid) || []);
    S.video = v;
    if (v.samples.length) {
      S.minPts = Math.min(...v.samples.map(s => s.pts));
      S.frames = v.samples.map(s => (s.pts - S.minPts) / 90000).sort((a, b) => a - b);

    if (v.playable) {

      S.vidUrl = URL.createObjectURL(blob);

    } else warn('Video codec ' + v.codec + ' cannot be remuxed for browser playback — metadata-only mode');
  } else warn('No video stream found');
  // KLV
  const klvStreams = [...ts.streams.values()].filter(s => s.kind === 'klv' || s.kind === 'private');
  const recs = [];
  for (const ks of klvStreams) {
    let rest = null, found = 0;
    for (const p of ts.pesList.get(ks.pid) || []) {
      const data = rest ? concatU8([rest, p.data]) : p.data;
      const r = scanKLV(data); rest = r.rest;
      for (const k of r.packets) { recs.push(makeRec(k.raw, p.pts, p.off, ks.pid)); found++; }
    }

}

async function loadMP4(buf, file) {
  S.kind = 'mp4';
  const m = parseMP4(buf); S.mp4 = m;
  const vt = m.tracks.find(t => t.handler === 'vide');
  if (vt) {
    const ts = vt.timescale;
    S.video = { codec: vt.entryType, timescale: ts, samples: vt.samples, width: vt.width, height: vt.height, entry: vt.entry, playable: true, track: vt };
    const base = vt.mediaStart;
    S.minPts = base;
    S.frames = vt.samples.map(s => (s.pts - base) / ts + vt.emptyStart).sort((a, b) => a - b);
  } else warn('No video track');
  const recs = [];
  for (const t of m.tracks.filter(t => t !== vt)) {
    for (const s of t.samples) {
      const r = scanKLV(buf.subarray(s.off, s.off + s.size));
      for (const k of r.packets) { const rec = makeRec(k.raw, null, s.off, 'trak ' + t.id); rec.t = (s.pts - t.mediaStart) / t.timescale + t.emptyStart; recs.push(rec); }
    }
    if (recs.length) S.klvTrack = t;
  }
  recs.forEach(r => r.t += CFG.klvOffset);
  S.klv = recs.sort((a, b) => a.t - b.t);
  S.vidUrl = URL.createObjectURL(file); S.playable = true;
  if (!S.klv.length) warn('No KLV metadata track in MP4 — load a sidecar (.klv / .csv / .json) to georeference');
}

function makeRec(raw, pts, off, src) {

  if (anchor) tsAnchor = { ts: anchor.f.ts, t: (anchor.pts - basePts) / scale };

function finishLoad() {
  const v = S.video;

    const d = []; for (let i = 1; i < Math.min(S.frames.length, 600); i++) d.push(S.frames[i] - S.frames[i - 1]);

  const kDur = S.klv.length ? S.klv[S.klv.length - 1].t : 0;
  S.dur = Math.max(vDur, kDur, 0.001);
  if (v && v.width) { CFG.imgW = v.width; CFG.imgH = v.height; document.documentElement.style.setProperty('--vidAR', v.width + '/' + v.height); }
  // security marking
  const sr = S.klv.find(r => r.f.security);

  const bar = $('#secbar');
  if (S.sec && S.sec.classification) {
    const c = S.sec.classification, col = { 'UNCLASSIFIED': '#2d6a2d', 'RESTRICTED': '#1f4f8f', 'CONFIDENTIAL': '#1f3f9f', 'SECRET': '#a3202c', 'TOP SECRET': '#c76a00' }[c] || '#555';
    bar.style.background = col;
    bar.textContent = 'METADATA SECURITY LS: ' + [c, S.sec['Classifying Country'], S.sec['SCI/SHI'], S.sec['Caveats'], S.sec['Releasing Instructions']].filter(Boolean).join(' // ');

const P = {

    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (moved) { cv.classList.add('drag'); MapV.pan(dx, dy); drag = [e.clientX, e.clientY]; if (S.follow) { S.follow = false; $('#bFollow').classList.remove('on'); } }
  });
  cv.addEventListener('pointerup', e => {
    cv.classList.remove('drag');
    if (drag && !moved && S.drawing) { const r = cv.getBoundingClientRect(); S.aoi.push(MapV.fromScr(e.clientX - r.left, e.clientY - r.top)); dirty(); }
    drag = null;
  });
  cv.addEventListener('dblclick', e => { e.preventDefault(); if (S.drawing) { if (S.aoi.length > 1) S.aoi.pop(); finishAOI(); } else { const r = cv.getBoundingClientRect(); MapV.zoomAt(1, e.clientX - r.left, e.clientY - r.top); } });
  cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); MapV.zoomAt(-e.deltaY * (e.deltaMode ? 0.05 : 0.0025), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  // split
  const sp = $('#split'); let sy = null, sh = 0;
  sp.addEventListener('pointerdown', e => { sy = e.clientY; sh = $('#bottom').getBoundingClientRect().height; sp.setPointerCapture(e.pointerId); });
  sp.addEventListener('pointermove', e => { if (sy === null) return; document.documentElement.style.setProperty('--bottomH', clamp(sh - (e.clientY - sy), 120, innerHeight - 260) + 'px'); dirty(); });
  sp.addEventListener('pointerup', () => { sy = null; });
  // keys
  addEventListener('keydown', e => {
    if (e.target.matches('input,select,textarea')) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); P.toggle(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? seek(P.time() - 1) : stepFrame(-1); }
    else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? seek(P.time() + 1) : stepFrame(1); }
    else if (k === 'i' || k === 'I') $('#bIn').click();
    else if (k === 'o' || k === 'O') $('#bOut').click();
    else if (k === '[') seek(S.inT ?? 0);
    else if (k === ']') seek(S.outT ?? S.dur);
    else if (k === 'Home') seek(0);
    else if (k === 'End') seek(S.dur);
    else if (k === 'f' || k === 'F') S.bbox && MapV.fit(S.bbox);
    else if (k === 'Enter' && S.drawing) finishAOI();
    else if (k === 'Escape' && S.drawing) { S.aoi = []; finishAOI(); }
  });
  // follow camera
  const origDraw = MapV.draw.bind(MapV);
  MapV.draw = function () {
    if (S.follow && S.cur && S.cur.fp) {
      const pts = S.cur.fp.pts.filter(p => !p.horizon);
      if (pts.length) { const la = pts.reduce((s, p) => s + p.lat, 0) / pts.length, lo = pts.reduce((s, p) => s + p.lon, 0) / pts.length; this.lat = la; this.lon = lo; }
    }
    origDraw();
  };
  buildSetPane(); buildSearchPane(); buildExportPane();
  requestAnimationFrame(loop);
}
init();

</script>
</body>
