<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISB Viewer</title>
<style>
:root{
  --bg:#0e1012;--p1:#15181b;--p2:#1b1f23;--p3:#23282d;--line:#2c3238;--line2:#3a424a;
  --tx:#cdd3d9;--mu:#7f8a94;--dim:#56606a;--acc:#f0a030;--acc2:rgba(240,160,48,.16);
  --ok:#7fbf7f;--bad:#e06c5c;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 var(--mono);overflow:hidden}
button,select,input{font:inherit;color:var(--tx);background:var(--p3);border:1px solid var(--line2);border-radius:2px;padding:3px 7px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.4;cursor:default;border-color:var(--line2)}
input[type=number]{width:72px}
input[type=text]{width:100%}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);vertical-align:-2px}
select{max-width:100%}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1 1 auto}
#secbar{display:none;text-align:center;font-weight:bold;letter-spacing:.12em;padding:2px;background:#2d6a2d;color:#fff}
#secbar.show{display:block}
header{display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--p1);border-bottom:1px solid var(--line)}
header .logo{font-weight:bold;letter-spacing:.14em;color:var(--acc)}
header .ver{color:var(--dim)}
header #fileName{color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
header #status{margin-left:auto;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}
#left{display:grid;grid-template-rows:1fr 5px var(--bottomH,300px) 150px;min-width:0;min-height:0}
#mapWrap{position:relative;min-height:0;overflow:hidden;background:#0b0d0e}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#map.draw{cursor:crosshair}
#map.drag{cursor:grabbing}
#mapTools{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
#mapTools button{background:rgba(21,24,27,.9)}
#mapRead{position:absolute;bottom:4px;left:8px;color:var(--tx);background:rgba(14,16,18,.75);padding:2px 6px;pointer-events:none}
#mapAttr{position:absolute;bottom:4px;right:8px;color:var(--mu);background:rgba(14,16,18,.75);padding:2px 6px;font-size:10px;pointer-events:none}
#legend{position:absolute;top:8px;right:8px;background:rgba(14,16,18,.82);padding:5px 8px;border:1px solid var(--line);pointer-events:none;line-height:1.6}
#legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mu);pointer-events:none;text-align:center}
#drop b{color:var(--tx);font-size:14px;letter-spacing:.08em}
body.dragover #mapWrap{outline:2px dashed var(--acc);outline-offset:-6px}
#split{background:var(--line);cursor:row-resize}
#split:hover{background:var(--acc)}
#bottom{display:grid;grid-template-columns:auto 1fr;min-height:0;background:var(--p1)}
#vidWrap{position:relative;height:100%;aspect-ratio:var(--vidAR,16/9);background:#000;overflow:hidden}
#vid{width:100%;height:100%;display:block;object-fit:fill}
#vidOv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#vidMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:20px;pointer-events:none}
#ctrl{display:flex;flex-direction:column;gap:6px;padding:8px 10px;min-width:0;overflow:auto}
.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tc{font-size:18px;color:var(--acc);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:1px 10px}
.kv span:nth-child(odd){color:var(--mu)}
#tl{width:100%;height:150px;display:block;background:var(--p1);border-top:1px solid var(--line);cursor:pointer}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--p1);min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1 1 auto;border:0;border-radius:0;background:none;padding:7px 3px;font-size:11px;letter-spacing:0;color:var(--mu);border-bottom:2px solid transparent}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none;overflow:auto;padding:10px;flex:1;min-height:0}
.pane.on{display:block}
h3{margin:12px 0 6px;font-size:11px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px}
h3:first-child{margin-top:0}
table{border-collapse:collapse;width:100%}
td,th{padding:2px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mu);font-weight:normal}
td.n{text-align:right;white-space:nowrap}
td.k{color:var(--mu);white-space:nowrap}
td.t{color:var(--dim);text-align:right;width:28px}
.muted{color:var(--mu)}
.dim{color:var(--dim)}
.okc{color:var(--ok)}
.badc{color:var(--bad)}
.accc{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;align-items:center}
.grid2 label{color:var(--mu)}
.field{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.field label{color:var(--mu)}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.note{color:var(--mu);font-size:11px;margin:4px 0 8px}
.res{border:1px solid var(--line);padding:5px 6px;margin-bottom:4px;cursor:pointer;background:var(--p2)}
.res:hover,.res.sel{border-color:var(--acc)}
.res .h{display:flex;justify-content:space-between;color:var(--acc)}
.rule{display:grid;grid-template-columns:1fr 54px 70px 22px;gap:3px;margin-bottom:3px}
.rule button{padding:0}
pre.hex{white-space:pre-wrap;word-break:break-all;color:var(--mu);font-size:11px;background:var(--p2);padding:6px;margin:4px 0}
.bar{height:4px;background:var(--p3);margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc)}
kbd{border:1px solid var(--line2);padding:0 3px;border-radius:2px;color:var(--mu)}
#tlPrev{position:fixed;display:none;pointer-events:none;border:1px solid var(--acc);background:#000;z-index:20}
#tlPrev div{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:var(--tx);font-size:10px;padding:1px 4px}
.mark{border:1px solid var(--line);padding:5px 6px;margin-bottom:4px;background:var(--p2)}
.mark.sel{border-color:var(--acc)}
.mark textarea{width:100%;font:inherit;color:var(--tx);background:var(--p3);border:1px solid var(--line2);min-height:34px;resize:vertical}
.tier{display:inline-block;padding:0 6px;border:1px solid var(--line2);border-radius:2px;margin-left:6px}
.tier.A{border-color:var(--ok);color:var(--ok)}.tier.B{border-color:#9fb3c8;color:#9fb3c8}.tier.C{border-color:var(--acc);color:var(--acc)}.tier.D{border-color:var(--bad);color:var(--bad)}
 #lib{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#lib.on{display:flex}
#libClass{text-align:center;font-weight:bold;letter-spacing:.1em;padding:2px;background:#2d6a2d;color:#fff}
.libbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--p1);border-bottom:1px solid var(--line);flex-wrap:wrap}
.libbar .logo{font-weight:bold;letter-spacing:.14em;color:var(--acc)}
.libbody{flex:1;display:grid;grid-template-columns:1fr 560px;min-height:0}
.libmap{position:relative;min-height:0;background:#0b0d0e}
.libmap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.libattr{position:absolute;bottom:4px;right:8px;color:var(--mu);background:rgba(14,16,18,.75);padding:2px 6px;font-size:10px;pointer-events:none}
.libside{border-left:1px solid var(--line);padding:10px;overflow:auto;background:var(--p1)}
.libside img{background:#000;object-fit:cover;display:block}
.pa{color:#e3b55f;text-decoration:underline dotted}.pd{color:#9fb3c8}
</style>
</head>
<body>
<div id="app">
<div id="secbar"></div>
<header>
  <span class="logo">MISB VIEWER</span><span class="ver" id="ver"></span>
  <button id="btnOpen" title="Open video, KLV, CSV/JSON metadata or DEM">Open…</button>
  <button id="btnLib" title="Video library (STAC catalogue in your folder)">Library</button>
  <input type="file" id="fileIn" multiple hidden>
  <span id="fileName" class="muted">no file</span>
  <span id="status"></span>
</header>
<main>
<section id="left">
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="mapTools">
      <button id="bFit" title="Fit map to flight">Fit</button>
      <button id="bFollow" title="Keep current footprint in view">Follow</button>
      <button id="bOrtho" title="Drape current frame on the map (pseudo-ortho)">Ortho</button>
      <button id="bHist" title="Show footprint history">History</button>
      <button id="bAoi" title="Draw observation area: click vertices, double-click to finish. One click + Enter = point">Draw AOI</button>
      <button id="bAoiClr" title="Clear AOI">Clear AOI</button>
    </div>
    <div id="legend"></div>
    <div id="drop"><b>DROP MOTION IMAGERY HERE</b><span>MISB MPEG-TS (.ts .m2ts .mpg) · MP4/MOV · raw KLV (.klv .bin)<br>sidecar metadata (.csv .json) · ESRI ASCII DEM (.asc)</span></div>
    <div id="mapRead"></div>
    <div id="mapAttr"></div>
  </div>
  <div id="split" title="Drag to resize"></div>
  <div id="bottom">
    <div id="vidWrap"><video id="vid" muted playsinline preload="auto"></video><canvas id="vidOv"></canvas><div id="vidMsg">No video loaded</div></div>
    <div id="ctrl">
      <div class="row"><span class="tc" id="tc" title="SMPTE timecode (media time)">--:--:--:--</span><span id="shut" class="accc"></span><span class="muted" id="fr">frame – / –</span></div>
      <div class="row muted" id="utc" title="UTC from metadata">UTC –</div>
      <div class="row">
        <button id="bStart" title="Start (Home)">|◀</button>
        <button id="bBack" title="−1 s (Shift+←)">◀◀</button>
        <button id="bPrev" title="−1 frame (← or K+J)">◀|</button>
        <button id="bPlay" title="Play/Pause (Space) · shuttle J/K/L" style="min-width:44px">▶</button>
        <button id="bNext" title="+1 frame (→ or K+L)">|▶</button>
        <button id="bFwd" title="+1 s (Shift+→)">▶▶</button>
        <button id="bEnd" title="End (End)">▶|</button>
        <select id="rate" title="Playback rate"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>
        <button id="bMark" title="Bookmark at playhead (M) · previous/next bookmark: , and .">◆ Mark</button>
        <button id="bLive" title="Track tagged objects through playback: as you play forward, each object's track is extended on the fly (first pass may hold the video while it catches up; replays use the stored track)">◉ Track on play</button>
        <button id="bTag" title="Tag an object in this frame (T): click its outline corners on the video, double-click to close; or drag a box">◇ Tag object</button>
      </div>
      <div class="row" id="clipRow">
        <button id="bIn" title="Set clip in (I)">In</button>
        <button id="bOut" title="Set clip out (O)">Out</button>
        <button id="bClr" title="Clear clip">Clear</button>
        <label><input type="checkbox" id="cLoop"> loop clip</label>
        <span class="muted" id="clipTxt"></span>
      </div>
      <div class="kv" id="hud"></div>
    </div>
  </div>
  <canvas id="tl"></canvas>
  <div id="tlPrev"><canvas width="192" height="108"></canvas><div></div></div>
</section>
<aside>
  <div id="tabs">
    <button data-p="pFile" class="on">FILE</button>
    <button data-p="pMeta">META</button>
    <button data-p="pMarks">MARKS</button>
    <button data-p="pObjects">OBJECTS</button>
    <button data-p="pSearch">SEARCH</button>
    <button data-p="pExport">EXPORT</button>
    <button data-p="pSet">SETTINGS</button>
  </div>
  <div class="pane on" id="pFile"><p class="muted">Open or drop a file to begin.</p></div>
  <div class="pane" id="pMeta"></div>
  <div class="pane" id="pMarks"></div>
  <div class="pane" id="pObjects"></div>
  <div class="pane" id="pSearch"></div>
  <div class="pane" id="pExport"></div>
  <div class="pane" id="pSet"></div>
</aside>
</main>
</div>
<script>
'use strict';
/* =====================================================================
   MISB VIEWER — single-file motion imagery metadata viewer
   No external libraries. No embedded binary. Network use is optional:
   basemap tiles and Terrarium DEM tiles only, both switchable off.
   ===================================================================== */
const BUILD = { ver: 'R0.4.3', build: 9 };

/* ---------- small utilities ---------- */
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, f) => a + (b - a) * f;
const isNum = v => typeof v === 'number' && isFinite(v);
const wrap360 = a => ((a % 360) + 360) % 360;
const angLerp = (a, b, f) => { let d = ((b - a + 540) % 360) - 180; return wrap360(a + d * f); };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmtT(t) {
  if (!isNum(t)) return '--:--.---';
  const s = Math.max(0, t), m = Math.floor(s / 60), r = s - m * 60;
  const hh = Math.floor(m / 60);
  return (hh ? hh + ':' + String(m % 60).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + r.toFixed(3).padStart(6, '0');
}
function fmtUTC(us) {
  if (!isNum(us)) return '–';
  const d = new Date(us / 1000);
  if (isNaN(d)) return '–';
  return d.toISOString().replace('T', ' ').replace('Z', 'Z');
}
const fx = (v, n = 1) => isNum(v) ? v.toFixed(n) : '–';
const fdeg = (v, n = 6) => isNum(v) ? v.toFixed(n) : '–';
function hex(u8, max = 4096) {
  let s = '';
  const n = Math.min(u8.length, max);
  for (let i = 0; i < n; i++) s += u8[i].toString(16).padStart(2, '0') + (i % 16 === 15 ? '\n' : ' ');
  return s + (u8.length > max ? '… (' + u8.length + ' bytes)' : '');
}
function download(name, data, type = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob(Array.isArray(data) ? data : [data], { type });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function concatU8(parts, total) {
  if (total === undefined) total = parts.reduce((s, p) => s + p.length, 0);
  const out = new Uint8Array(total); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function readU(b, i = 0, n = b.length - i) { let v = 0; for (let k = 0; k < n; k++) v = v * 256 + b[i + k]; return v; }
function readS(b, i = 0, n = b.length - i) { const u = readU(b, i, n); return b[i] & 0x80 ? u - 2 ** (8 * n) : u; }
const td = new TextDecoder('utf-8');
const str = b => td.decode(b).replace(/\0+$/, '');
function median(a) { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; }
function bsearchLE(arr, t, key) { // largest index with key(arr[i]) <= t
  let lo = 0, hi = arr.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (key(arr[m]) <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

/* =====================================================================
   MPEG-TS DEMUX (ISO/IEC 13818-1) — PAT/PMT, PES, KLV per MISB ST1402
   ===================================================================== */
const STREAM_TYPES = {
  0x01: ['video', 'MPEG-1 video'], 0x02: ['video', 'MPEG-2 video'], 0x10: ['video', 'MPEG-4 Part 2'],
  0x1B: ['video', 'H.264/AVC'], 0x24: ['video', 'H.265/HEVC'],
  0x03: ['audio', 'MPEG-1 audio'], 0x04: ['audio', 'MPEG-2 audio'], 0x0F: ['audio', 'AAC'], 0x11: ['audio', 'AAC LATM'], 0x81: ['audio', 'AC-3'],
  0x15: ['klv', 'Metadata in PES (sync KLV)'], 0x06: ['private', 'Private PES'],
};

function detectTS(u8) {
  for (const ps of [188, 192, 204]) {
    const pre = ps === 192 ? 4 : 0;
    for (let off = 0; off < ps; off++) {
      let ok = true;
      for (let k = 0; k < 6; k++) { const p = off + k * ps + pre; if (p >= u8.length || u8[p] !== 0x47) { ok = false; break; } }
      if (ok) return { ps, off: off + pre };
    }
  }
  return null;
}

function readPTS(b, i) {
  return ((b[i] >> 1) & 7) * 1073741824 + b[i + 1] * 4194304 + (b[i + 2] >> 1) * 32768 + b[i + 3] * 128 + (b[i + 4] >> 1);
}

function makeUnwrapper() {
  let last = null, add = 0;
  return v => {
    if (v === null || v === undefined) return v;
    let x = v + add;
    if (last !== null) {
      if (x - last < -4294967296) { add += 8589934592; x += 8589934592; }
      else if (x - last > 4294967296) { add -= 8589934592; x -= 8589934592; }
    }
    last = x; return x;
  };
}

function parsePSI(pay) {
  const ptr = pay[0];
  const s = 1 + ptr;
  if (s + 3 > pay.length) return null;
  const tid = pay[s], len = ((pay[s + 1] & 0x0F) << 8) | pay[s + 2];
  return { tid, sec: pay.subarray(s, Math.min(pay.length, s + 3 + len)), len };
}

async function demuxTS(u8, progress) {
  const det = detectTS(u8);
  if (!det) throw new Error('No MPEG-TS sync found');
  const { ps } = det;
  const pmtPids = new Map(); // pid -> program
  const streams = new Map(); // pid -> info
  const cur = new Map();     // pid -> {off, chunks, len}
  const pesList = new Map(); // pid -> [{off, data, pts, dts, sid}]
  const unwrap = new Map();
  let firstPAT = null, firstPMT = null, pcrPid = -1, pktCount = 0, resyncs = 0;

  function flush(pid) {
    const c = cur.get(pid); if (!c) return;
    cur.delete(pid);
    const d = c.chunks.length === 1 ? c.chunks[0] : concatU8(c.chunks, c.len);
    if (d.length < 9 || d[0] !== 0 || d[1] !== 0 || d[2] !== 1) return;
    const sid = d[3], plen = (d[4] << 8) | d[5];
    let pts = null, dts = null, start = 6;
    if (!(sid === 0xBC || sid === 0xBE || sid === 0xBF || sid === 0xF0 || sid === 0xF1 || sid === 0xFF || sid === 0xF2 || sid === 0xF8)) {
      const flags = d[7], hdl = d[8];
      if ((flags & 0x80) && d.length >= 14) pts = readPTS(d, 9);
      if ((flags & 0x40) && d.length >= 19) dts = readPTS(d, 14);
      start = 9 + hdl;
    }
    let end = plen ? Math.min(d.length, 6 + plen) : d.length;
    if (start > end) return;
    let uw = unwrap.get(pid); if (!uw) { uw = makeUnwrapper(); unwrap.set(pid, uw); }
    if (pts !== null) pts = uw(pts);
    if (dts !== null) dts = uw(dts);
    let arr = pesList.get(pid); if (!arr) { arr = []; pesList.set(pid, arr); }
    arr.push({ off: c.off, data: d.subarray(start, end), pts, dts, sid });
  }

  const n = u8.length;
  let lastYield = performance.now();
  for (let p = det.off; p + 188 <= n; p += ps) {
    if (u8[p] !== 0x47) { // resync
      let q = p + 1;
      while (q + 188 <= n && !(u8[q] === 0x47 && (q + ps >= n || u8[q + ps] === 0x47))) q++;
      resyncs++; p = q - ps; continue;
    }
    pktCount++;
    const b1 = u8[p + 1], pusi = b1 & 0x40, pid = ((b1 & 0x1F) << 8) | u8[p + 2], afc = (u8[p + 3] >> 4) & 3;
    let i = p + 4;
    if (afc & 2) i += 1 + u8[p + 4];
    if (!(afc & 1) || i >= p + 188) continue;
    const pay = u8.subarray(i, p + 188);
    if (pid === 0) {
      if (!pusi) continue;
      const psi = parsePSI(pay); if (!psi || psi.tid !== 0) continue;
      if (!firstPAT) firstPAT = u8.slice(p, p + 188);
      const sec = psi.sec, end = Math.min(sec.length, 3 + psi.len - 4);

/* =====================================================================
   PROVENANCE & GEOMETRY TIERS
   Every geometry input is tagged:  m = measured (recorded in metadata)
                                    d = derived  (computed from measured values)
                                    a = assumed  (user setting, preset or fallback)
   Tiers (by what the metadata itself carries, majority of records):
     A  camera pointing + FOV        -> view box, ortho, NIIRS, AOI search
     B  encoder frame centre/corners -> view box from corners, limited NIIRS
     C  platform position only       -> track / time / area-of-ops search
     D  no position                  -> playback and catalogue only
   "Assume sensor geometry" can lift C to an assumed A; everything it
   touches is flagged 'a' and carried into the map, HUD and exports.
   ===================================================================== */

const PROV_LABEL = { m: 'measured', d: 'derived', a: 'assumed' };

function mat2ypr(M) { return [Math.atan2(M[3], M[0]) * R2D, Math.asin(clamp(-M[6], -1, 1)) * R2D, Math.atan2(M[7], M[8]) * R2D]; }

/* fill missing camera geometry with assumptions (reversible) */

  if (!CFG.assumeOn) return 0;
  let n = 0, lastCourse = null;
  const sorted = recs.slice().sort((a, b) => a.t - b.t);
  sorted.forEach((r, i) => {
    const f = r.f; if (!isNum(f.sensLat) || !isNum(f.sensLon)) return;
    // course over ground from neighbours
    const a = sorted[Math.max(0, i - 3)].f, b = sorted[Math.min(sorted.length - 1, i + 3)].f;
    if (isNum(a.sensLat) && isNum(b.sensLat)) { const dn = (b.sensLat - a.sensLat) * mpdLat(f.sensLat), de = (b.sensLon - a.sensLon) * mpdLon(f.sensLat); if (Math.hypot(dn, de) > 2) lastCourse = wrap360(Math.atan2(de, dn) * R2D); }

      const yaw = CFG.assumeYaw === 'fixed' ? CFG.assumeYawVal : CFG.assumeYaw === 'course' ? (lastCourse ?? f.platHdg ?? 0) : (isNum(f.platHdg) ? f.platHdg : (lastCourse ?? 0));

      if (isNum(f.platHdg)) {
        const Pm = m3(m3(rz(f.platHdg * D2R), ry((f.platPitch || 0) * D2R)), rx((f.platRoll || 0) * D2R));
        const [az, el, ro] = mat2ypr(m3(m3t(Pm), Rabs));

/* canvas helpers for confidence styling */

    h('div', { class: 'grid2' }, h('label', null, 'Terrarium zoom (10–14)'), num('demZoom', true, 1), h('label', null, 'Flat fallback elev m'), num('flatElev', true), h('label', null, 'Geoid N m (HAE→MSL)'), num('geoidOffset', true), h('label', null, 'Max ray range m'), num('maxRange', true, 1000)),
    h('div', { class: 'btns' }, h('button', { onclick: () => pickFile('.asc,.txt', f => loadASC(f)) }, 'Load ASCII grid…')),
    h('div', { class: 'note', id: 'demStat' }),
    h('h3', null, 'Drone telemetry (non-MISB)'),
    h('div', { class: 'grid2' },
      h('label', null, 'Altitude reference'), sel('droneAlt', [['rel', 'Relative height + take-off ground'], ['abs', 'Recorded absolute altitude']], false, () => { rebuildTrack(); buildFilePane(); }),
      h('label', { title: 'Blank = DEM at first position, else flat fallback' }, 'Take-off ground m MSL'), h('input', { type: 'text', value: CFG.takeoffElev, placeholder: 'auto', onchange: e => { CFG.takeoffElev = e.target.value.trim(); rebuildTrack(); buildFilePane(); apply(false); } }),
      h('label', { title: 'Used when the metadata has no FOV or focal length' }, 'Lens (35 mm eq.) mm'), num('lensMm', false, 1, () => { rederiveDrone(); rebuildTrack(); buildFilePane(); }),
      h('label', null, 'HFOV override °'), num('hfovOverride', false, 0.1, () => { rederiveDrone(); rebuildTrack(); buildFilePane(); }),
      h('label', null, 'Gimbal yaw'), sel('gimbalYawMode', [['auto', 'Auto-detect'], ['abs', 'Absolute (true bearing)'], ['rel', 'Relative to airframe']], false, () => { rederiveDrone(); rebuildTrack(); }),
      ...(S.logSegments && S.logSegments.length > 1 ? [h('label', null, 'Flight-log video segment'), h('select', { onchange: e => { CFG.logSegment = +e.target.value; const fl = parseFlightLogCSV(S.logRows.rows, S.logRows.hdr); S.klv = S.sidecar = fl.recs; finishLoad(); } }, S.logSegments.map(sg => h('option', { value: sg.i, selected: sg.i === (S.logChosen ?? 0) }, '#' + (sg.i + 1) + ' · ' + sg.dur.toFixed(0) + ' s')))] : [])),
    h('div', { class: 'note' }, 'For DJI SRT, DJI djmd, Parrot and flight-log sources. DJI absolute altitude is often unreliable; relative height plus take-off ground is the default. Gimbal yaw auto-detect: a flight log whose gimbal yaw does not follow the drone heading is treated as relative to the airframe.'),
    h('h3', null, 'Assumed sensor geometry'),
    h('label', null, h('input', { type: 'checkbox', checked: CFG.assumeOn, onchange: e => { CFG.assumeOn = e.target.checked; rebuildTrack(); buildFilePane(); buildSearchPane(); buildExportPane(); apply(false); } }), ' assume camera geometry where the metadata lacks it'),
    h('div', { class: 'grid2' },
      h('label', null, 'Camera pitch °'), num('assumePitch', false, 1, () => { rebuildTrack(); }),
      h('label', null, 'Camera yaw'), sel('assumeYaw', [['heading', 'Platform heading'], ['course', 'Course over ground'], ['fixed', 'Fixed bearing']], false, () => { rebuildTrack(); }),
      h('label', null, 'Fixed bearing °T'), num('assumeYawVal', false, 1, () => { rebuildTrack(); }),
      h('label', null, 'HFOV °'), num('assumeHfov', false, 0.5, () => { rebuildTrack(); }),
      h('label', { title: 'Radius of the possible-coverage disc for platform-only files' }, 'Max look angle °'), num('maxLook', false, 1)),
    h('div', { class: 'note' }, 'Lifts a platform-only file (tier C) to an assumed view box. Every assumed value is flagged: dotted/hatched on the map, ᵃ in the HUD, provenance columns in exports, and the converted KLV mission ID ends in -ASSUMED. Measured values are never overwritten.'),
    h('h3', null, 'Footprint & interpolation'),
    h('div', { class: 'grid2' },
      h('label', null, 'Footprint source'), sel('footprint', [['auto', 'Auto (pose → corners)'], ['computed', 'Sensor model only'], ['metadata', 'KLV corners only']], true),
      h('label', null, 'Interpolation'), sel('interp', [['nearest', 'Nearest packet'], ['linear', 'Linear (angle-aware)'], ['spline', 'Catmull-Rom position']], true),
      h('label', { title: 'How long a sparse tag value is carried forward' }, 'Hold sparse tags s'), num('holdMax', true, 0.5, () => { S.track = S.klv.length ? new Track(S.klv) : null; }),
      h('label', { title: 'Shift metadata against video (positive = later)' }, 'KLV time offset s'), h('input', { type: 'number', value: CFG.klvOffset, step: 0.01, onchange: e => { const nv = parseFloat(e.target.value) || 0, d = nv - CFG.klvOffset; CFG.klvOffset = nv; S.klv.forEach(r => r.t += d); S.track = S.klv.length ? new Track(S.klv) : null; apply(true); } }),
      h('label', null, 'History step s'), num('histStep', true, 0.5),
      h('label', null, 'Image size override'), h('div', { class: 'row' }, num('imgW', true, 1), num('imgH', true, 1))),
    h('label', null, h('input', { type: 'checkbox', id: 'cMetaCorners', checked: true, onchange: dirty }), ' show encoder (KLV) corners when using the sensor model'),
    h('h3', null, 'Pseudo-ortho'),
    h('div', { class: 'grid2' }, h('label', null, 'Mesh columns'), num('orthoGrid', false, 1), h('label', null, 'Opacity'), h('input', { type: 'range', min: 0.1, max: 1, step: 0.05, value: CFG.orthoAlpha, oninput: e => { CFG.orthoAlpha = +e.target.value; dirty(); } })),
    h('div', { class: 'note' }, 'Each mesh node is a ray from the sensor model through the image, intersected with the DEM (or the KLV corner homography when pose is absent). The frame is texture-mapped per triangle — terrain-following, but not a rigorous orthorectification.'),
    h('h3', null, 'NIIRS estimate'),
    h('div', { class: 'grid2' },
      h('label', null, 'Equation'), sel('giqe', [[4, 'GIQE 4'], [5, 'GIQE 5']], true),
      h('label', null, 'RER'), num('rer', true, 0.05), h('label', null, 'H (overshoot) [4]'), num('hgain', true, 0.05), h('label', null, 'G/SNR [4]'), num('gsnr', true, 0.01), h('label', null, 'SNR [5]'), num('snr', true, 1)),
    h('div', { class: 'note' }, 'Geometric estimate only: GSD from slant range, IFOV (FOV / pixels) and grazing angle at the frame centre or AOI. Optics, motion blur and compression are folded into RER/H/SNR defaults; this is a still-image GIQE figure, not a V-NIIRS (MISB ST 0901) rating.'),
    h('h3', null, 'Keyboard'),
    h('div', { class: 'note', html: '<kbd>J</kbd>/<kbd>K</kbd>/<kbd>L</kbd> shuttle (repeat for 2×/4×/8×, J = reverse) · <kbd>K</kbd>+<kbd>J</kbd>/<kbd>L</kbd> frame step · <kbd>Space</kbd> play · <kbd>←</kbd>/<kbd>→</kbd> frame · <kbd>Shift</kbd>+arrows 1 s · <kbd>I</kbd>/<kbd>O</kbd> in/out · <kbd>[</kbd>/<kbd>]</kbd> go to in/out · <kbd>M</kbd> bookmark · <kbd>,</kbd>/<kbd>.</kbd> prev/next bookmark · <kbd>=</kbd>/<kbd>-</kbd> zoom timeline · <kbd>\\</kbd> fit timeline · wheel on timeline zooms, Shift+wheel pans, drag the top bar to pan · <kbd>F</kbd> fit map · <kbd>Esc</kbd> cancel AOI' }),
    h('div', { class: 'note dim' }, 'MISB Viewer ' + BUILD.ver + ' build ' + BUILD.build + ' — single file, no external libraries, no embedded binary.'),
  );
  updateDemStatus();
}

/* =====================================================================
   WIRING
   ===================================================================== */
function init() {
  $('#ver').textContent = BUILD.ver + ' · build ' + BUILD.build;
  MapV.init($('#map'));
  // tabs
  for (const b of document.querySelectorAll('#tabs button')) b.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.id === b.dataset.p));
    if (b.dataset.p === 'pMeta') { S.pktIdx = -1; updateMetaPane(P.time()); }
  };
  // file open / drop
  $('#btnOpen').onclick = () => $('#fileIn').click();
  buildLibUI(); $('#btnLib').onclick = openLib;
  $('#fileIn').onchange = e => { openFiles(e.target.files); e.target.value = ''; };
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
  addEventListener('dragleave', e => { if (e.target === document.documentElement || !e.relatedTarget) document.body.classList.remove('dragover'); });
  addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragover'); if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files); });
  // transport
  $('#bPlay').onclick = () => P.toggle();
  $('#bPrev').onclick = () => stepFrame(-1); $('#bNext').onclick = () => stepFrame(1);
  $('#bBack').onclick = () => seek(P.time() - 1); $('#bFwd').onclick = () => seek(P.time() + 1);
  $('#bStart').onclick = () => seek(S.inT ?? 0); $('#bEnd').onclick = () => seek(S.outT ?? S.dur);
  $('#rate').onchange = e => { vid.playbackRate = +e.target.value; if (P.playing && !P.rev) { P.shuttle = +e.target.value; $('#shut').textContent = +e.target.value !== 1 ? '▶ ' + e.target.value + '×' : ''; } };
  $('#bIn').onclick = () => { S.inT = P.time(); if (S.outT !== null && S.outT < S.inT) S.outT = null; buildExportPane(); dirty(); };
  $('#bOut').onclick = () => { S.outT = P.time(); if (S.inT !== null && S.inT > S.outT) S.inT = null; buildExportPane(); dirty(); };
  $('#bClr').onclick = () => { S.inT = S.outT = null; buildExportPane(); dirty(); };
  // chart picker
  const cs = h('select', { title: 'Timeline chart', onchange: e => { S.chartKey = e.target.value; dirty(); } }, Object.entries(CHARTS).map(([k, [l]]) => h('option', { value: k }, l)));
  $('#clipRow').append(h('span', { class: 'muted', style: 'margin-left:auto' }, 'chart'), cs);
  // map tools
  $('#bFit').onclick = () => S.bbox && MapV.fit(S.bbox);
  $('#bFollow').onclick = e => { S.follow = !S.follow; e.target.classList.toggle('on', S.follow); dirty(); };
  $('#bOrtho').onclick = e => { S.ortho = !S.ortho; e.target.classList.toggle('on', S.ortho); if (S.ortho && !S.playable) status('Ortho needs a playable video'); dirty(); };
  $('#bHist').classList.add('on');
  $('#bHist').onclick = e => { S.showHist = !S.showHist; e.target.classList.toggle('on', S.showHist); dirty(); };
  $('#bAoi').onclick = () => S.drawing ? finishAOI() : startAOI();
  $('#bAoiClr').onclick = clearAOI;
  // map interaction
  const cv = $('#map'); let drag = null, moved = false;
  cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; moved = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect(), [la, lo] = MapV.fromScr(e.clientX - r.left, e.clientY - r.top);
    const el = DEM.active() ? DEM.sample(la, lo) : null;
    $('#mapRead').textContent = la.toFixed(6) + ', ' + lo.toFixed(6) + (el !== null ? ' · ' + el.toFixed(0) + ' m' : '') + ' · z' + MapV.z.toFixed(1);
    if (!drag) return;
    const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (moved) { cv.classList.add('drag'); MapV.pan(dx, dy); drag = [e.clientX, e.clientY]; if (S.follow) { S.follow = false; $('#bFollow').classList.remove('on'); } }
  });
  cv.addEventListener('pointerup', e => {
    cv.classList.remove('drag');
    if (drag && !moved && S.drawing) { const r = cv.getBoundingClientRect(); S.aoi.push(MapV.fromScr(e.clientX - r.left, e.clientY - r.top)); dirty(); }
    drag = null;
  });
  cv.addEventListener('dblclick', e => { e.preventDefault(); if (S.drawing) { if (S.aoi.length > 1) S.aoi.pop(); finishAOI(); } else { const r = cv.getBoundingClientRect(); MapV.zoomAt(1, e.clientX - r.left, e.clientY - r.top); } });
  cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); MapV.zoomAt(-e.deltaY * (e.deltaMode ? 0.05 : 0.0025), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  // split
  const sp = $('#split'); let sy = null, sh = 0;
  sp.addEventListener('pointerdown', e => { sy = e.clientY; sh = $('#bottom').getBoundingClientRect().height; sp.setPointerCapture(e.pointerId); });
  sp.addEventListener('pointermove', e => { if (sy === null) return; document.documentElement.style.setProperty('--bottomH', clamp(sh - (e.clientY - sy), 120, innerHeight - 260) + 'px'); dirty(); });
  sp.addEventListener('pointerup', () => { sy = null; });
  installKeys();
  $('#bMark').onclick = addMark;
  $('#bLive').onclick = () => { CFG.liveTrack = !CFG.liveTrack; if (!CFG.liveTrack) liveRelease(); liveBtn(); buildObjPane(); };
  liveBtn(); livePump();
  $('#bTag').onclick = () => OBJ.drawing ? cancelTag() : startTag();
  // follow camera
  const origDraw = MapV.draw.bind(MapV);
  MapV.draw = function () {
    if (S.follow && S.cur && S.cur.fp) {
      const pts = S.cur.fp.pts.filter(p => !p.horizon);
      if (pts.length) { const la = pts.reduce((s, p) => s + p.lat, 0) / pts.length, lo = pts.reduce((s, p) => s + p.lon, 0) / pts.length; this.lat = la; this.lon = lo; }
    }
    origDraw();
  };
  buildSetPane(); buildSearchPane(); buildExportPane(); buildMarksPane(); buildObjPane();
  requestAnimationFrame(loop);
}
init();

</script>
